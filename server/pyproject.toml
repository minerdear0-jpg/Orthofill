[project]
name = "orthofill-receiver"
version = "0.1.0"
description = "Приёмник телеметрии Orthofill: приём событий, хранение, живая страница"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
