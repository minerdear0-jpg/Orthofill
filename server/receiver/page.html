<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orthofill — телеметрия</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --line: #e2e1dc; --grid: #ecebe6;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7b7a74;
  --series: #2a78d6; --accent: #1f5f8b;
  --warn: #9a5b00; --bad: #b42318; --good: #1f7a3f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --line: #33332f; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --series: #3987e5; --accent: #7fb2dc;
    --warn: #e0a440; --bad: #f07a6e; --good: #5cc282;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --line: #33332f; --grid: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
  --series: #3987e5; --accent: #7fb2dc;
  --warn: #e0a440; --bad: #f07a6e; --good: #5cc282;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
         padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font-size: 17px; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
.muted { color: var(--muted); }
.state { font-size: 13px; color: var(--text-2); }
.state.bad { color: var(--bad); }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .cols { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } }
.who { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.chip b { font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.feed { max-height: 460px; overflow: auto; }
.feed td.detail { color: var(--text-2); word-break: break-word; }
.feed td:not(.detail), #speed td { white-space: nowrap; }
.feed td.detail { min-width: 220px; }
.ev { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.ev.error, .ev.key_noop { color: var(--bad); }
.ev.note_confirm { color: var(--good); }
.multiples { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.panel h3 { font-size: 13px; font-weight: 600; margin: 0; }
.panel .now { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.panel .sub { font-size: 12px; color: var(--muted); }
.panel svg { display: block; width: 100%; height: 84px; overflow: visible; }
.panel .axis { stroke: var(--line); stroke-width: 1; }
.panel .lineS { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.panel .dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.panel .hit { fill: transparent; }
.tip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface);
       font-size: 12px; padding: 4px 8px; border-radius: 4px; display: none; z-index: 10; white-space: nowrap; }
.scroll { overflow-x: auto; }
details summary { cursor: pointer; color: var(--text-2); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Orthofill — телеметрия</h1>
  <span class="state" id="state">подключение…</span>
</header>
<main>
  <div class="cols">
    <section>
      <h2>Сейчас</h2>
      <div class="who" id="who"><span class="muted">никого за последние 10 минут</span></div>
      <div class="feed" style="margin-top:10px">
        <table>
          <thead><tr><th>Время</th><th>Врач</th><th>Событие</th><th>Подробности</th></tr></thead>
          <tbody id="feed"></tbody>
        </table>
      </div>
    </section>
    <section>
      <h2>Скорость <span class="muted" style="font-weight:400">— мс, 30 дней</span></h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Версия</th><th>Врач</th><th>Замер</th><th class="num">n</th><th class="num">медиана</th><th class="num">95%</th></tr></thead>
          <tbody id="speed"></tbody>
        </table>
      </div>
    </section>
  </div>
  <section>
    <h2>Использование по дням <span class="muted" style="font-weight:400">— 30 дней; кривые привыкания</span></h2>
    <div class="multiples" id="usage"></div>
    <details>
      <summary>Таблица</summary>
      <div class="scroll"><table id="usageTable"></table></div>
    </details>
  </section>
</main>
<div class="tip" id="tip"></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const SVG = 'http' + '://www.w3.org/2000/svg';   // пространство имён SVG, не адрес
const svg = (tag, attrs) => {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
let last = 0;
const names = {};          // install → подпись врача

function who(e) {
  const id = e.install || '';
  if (e.doctor) names[id] = e.doctor;
  return names[id] || (id ? id.slice(0, 6) : '—');
}

const SKIP = new Set(['id', 'ts', 'event', 'install', 'doctor', 'version', 'build', '_row',
                      '_received', 'traceback', 'facts', 'raw_norm', 'preset_name']);
function detail(e) {
  const parts = [];
  for (const k of Object.keys(e)) {
    if (SKIP.has(k)) continue;
    let v = e[k];
    if (v === null || v === '' || (Array.isArray(v) && !v.length)) continue;
    if (typeof v === 'object') v = JSON.stringify(v);
    v = String(v);
    if (v.length > 80) v = v.slice(0, 79) + '…';
    parts.push(k + '=' + v);
  }
  const s = parts.join('  ');
  return s.length > 240 ? s.slice(0, 239) + '…' : s;
}

function addFeed(events) {
  const body = $('feed');
  for (const e of events) {
    const tr = el('tr');
    const t = (e.ts || '').slice(11, 19) || (e._received || '').slice(11, 19);
    tr.append(el('td', 'muted', t), el('td', '', who(e)), el('td', 'ev ' + (e.event || ''), e.event || ''),
              el('td', 'detail', detail(e)));
    body.prepend(tr);
  }
  while (body.rows.length > 300) body.deleteRow(body.rows.length - 1);
}

function setWho(online) {
  const box = $('who');
  box.replaceChildren();
  if (!online.length) { box.append(el('span', 'muted', 'никого за последние 10 минут')); return; }
  for (const o of online) {
    if (o.doctor) names[o.install] = o.doctor;
    const c = el('span', 'chip');
    c.append(el('b', '', names[o.install] || o.install.slice(0, 6)),
             document.createTextNode(' · ' + (o.version || '?') + ' · ' + o.events + ' соб.'));
    box.append(c);
  }
}

function state(text, bad) {
  const s = $('state');
  s.textContent = text;
  s.className = 'state' + (bad ? ' bad' : '');
}

async function get(url) {
  const r = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function pollFeed() {
  try {
    const d = await get('/v1/feed?since=' + last);
    if (d.events.length) {
      addFeed(d.events);
      last = Math.max(last, d.events[d.events.length - 1]._row);
    }
    setWho(d.online || []);
    state('обновлено ' + new Date().toLocaleTimeString('ru-RU') + ' · событий в базе до №' + d.last);
  } catch (err) {
    state('нет связи с приёмником (' + err.message + ') — повтор…', true);
  }
  setTimeout(pollFeed, 2000);
}

// ---------- использование: маленькие графики, одна величина в каждом ----------
const PANELS = [
  { key: 'notes', title: 'Записей за день', fmt: (v) => String(Math.round(v)), val: (d) => d.notes },
  { key: 'hints', title: 'Подсказок принято на запись', val: (d) => d.notes ? d.hints / d.notes : null },
  { key: 'hint_rate', title: 'Доля принятых подсказок', pct: true,
    val: (d) => d.hints_shown ? d.hints / d.hints_shown : null },
  { key: 'habits', title: 'Хвостов фраз на запись', val: (d) => d.notes ? d.habits / d.notes : null },
  { key: 'phrases', title: '.фраз на запись', val: (d) => d.notes ? d.phrases / d.notes : null },
  { key: 'adds', title: '«Добавить пункт» на запись', val: (d) => d.notes ? d.adds / d.notes : null },
  { key: 'edited', title: 'Записей с правкой протокола', pct: true,
    val: (d) => d.notes ? d.edited / d.notes : null },
  { key: 'key_noop', title: 'Несработавших сочетаний', fmt: (v) => String(Math.round(v)), val: (d) => d.key_noop },
  { key: 'errors', title: 'Ошибок программы', fmt: (v) => String(Math.round(v)), val: (d) => d.errors },
];

function fmt(p, v) {
  if (v === null || v === undefined) return '—';
  if (p.fmt) return p.fmt(v);
  if (p.pct) return Math.round(v * 100) + '%';
  return v.toFixed(2).replace('.', ',');
}

function panel(p, days) {
  const box = el('div', 'panel');
  const pts = days.map((d) => ({ day: d.day, v: p.val(d) })).filter((x) => x.v !== null);
  const cur = pts.length ? pts[pts.length - 1] : null;
  box.append(el('h3', '', p.title), el('div', 'now', cur ? fmt(p, cur.v) : '—'),
             el('div', 'sub', cur ? 'последний день: ' + cur.day.slice(5) : 'нет данных'));
  const W = 240, H = 84, padT = 6, padB = 6;
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
                         'aria-label': p.title });
  s.append(svg('line', { class: 'axis', x1: 0, x2: W, y1: H - padB, y2: H - padB }));
  if (pts.length) {
    const max = Math.max(...pts.map((x) => x.v)) || 1;
    const x = (i) => pts.length === 1 ? W / 2 : 4 + i * (W - 8) / (pts.length - 1);
    const y = (v) => H - padB - (v / max) * (H - padT - padB);
    if (pts.length > 1) {
      s.append(svg('polyline', { class: 'lineS', points: pts.map((q, i) => x(i) + ',' + y(q.v)).join(' ') }));
    }
    const lastP = pts.length - 1;
    s.append(svg('circle', { class: 'dot', cx: x(lastP), cy: y(pts[lastP].v), r: 4 }));
    const step = pts.length > 1 ? (W - 8) / (pts.length - 1) : W;
    pts.forEach((q, i) => {
      const hit = svg('rect', { class: 'hit', x: x(i) - step / 2, y: 0, width: step, height: H });
      hit.addEventListener('mousemove', (ev) => tip(ev, q.day + ': ' + fmt(p, q.v)));
      hit.addEventListener('mouseleave', hideTip);
      s.append(hit);
    });
  }
  box.append(s);
  return box;
}

function tip(ev, text) {
  const t = $('tip');
  t.textContent = text;
  t.style.display = 'block';
  t.style.left = Math.min(ev.clientX + 12, window.innerWidth - t.offsetWidth - 8) + 'px';
  t.style.top = (ev.clientY - 30) + 'px';
}
function hideTip() { $('tip').style.display = 'none'; }

function usageTable(days) {
  const t = $('usageTable');
  t.replaceChildren();
  const cols = ['day', 'notes', 'hints_shown', 'hints', 'hints_erased', 'habits', 'phrases', 'adds',
                'edited', 'keep_edit', 'key_noop', 'errors'];
  const head = el('tr');
  cols.forEach((c) => head.append(el('th', c === 'day' ? '' : 'num', c)));
  t.append(head);
  for (const d of days.slice().reverse()) {
    const tr = el('tr');
    cols.forEach((c) => tr.append(el('td', c === 'day' ? '' : 'num', String(d[c]))));
    t.append(tr);
  }
}

async function pollSlow() {
  try {
    const u = await get('/v1/usage?days=30');
    const box = $('usage');
    box.replaceChildren(...PANELS.map((p) => panel(p, u.days)));
    usageTable(u.days);
    const sp = await get('/v1/speed?days=30');
    const body = $('speed');
    body.replaceChildren();
    if (!sp.rows.length) {
      const tr = el('tr');
      const td = el('td', 'muted', 'пока нет замеров');
      td.colSpan = 6;
      tr.append(td);
      body.append(tr);
    }
    for (const r of sp.rows) {
      const tr = el('tr');
      tr.append(el('td', '', r.version), el('td', '', names[r.install] || r.install.slice(0, 6)),
                el('td', '', r.metric), el('td', 'num', String(r.n)),
                el('td', 'num', String(Math.round(r.med))), el('td', 'num', String(Math.round(r.p95))));
      body.append(tr);
    }
  } catch (err) {
    state('сводки не загрузились (' + err.message + ')', true);
  }
  setTimeout(pollSlow, 60000);
}

pollFeed();
pollSlow();
</script>
</body>
</html>
