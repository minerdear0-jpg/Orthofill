[project]
name = "orthofill"
version = "0.2.0b7"
description = "Краткая запись ортодонта → протокол приёма по классификатору"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "sv-ttk>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
